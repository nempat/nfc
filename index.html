<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101817"><meta name="description" content="Share your experience with Universal Kebabs & Biryani."><title>Rate your visit | Universal Kebabs & Biryani</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><div class="top"><span class="mini-icon">✦</span><span>WE VALUE YOUR FEEDBACK</span></div><section class="panel"><div class="brand-mark" aria-hidden="true">UK<span>&</span>B</div><p class="eyebrow">UNIVERSAL KEBABS & BIRYANI</p><h1>How was your<br><em>experience?</em></h1><p class="subtitle">Your feedback helps us serve you better. Tap a star to continue.</p><div class="stars" role="group" aria-label="Choose a rating from one to five stars"><button type="button" aria-label="1 star" data-rating="1">★</button><button type="button" aria-label="2 stars" data-rating="2">★</button><button type="button" aria-label="3 stars" data-rating="3">★</button><button type="button" aria-label="4 stars" data-rating="4">★</button><button type="button" aria-label="5 stars" data-rating="5">★</button></div><div class="scale"><span>Not great</span><span>Amazing</span></div><p class="note">You'll be able to share a public Google review or send feedback privately.</p></section><footer>Made for meaningful feedback · No sign-in required</footer></main><script>const buttons=[...document.querySelectorAll('[data-rating]')];buttons.forEach((btn,i)=>{btn.addEventListener('mouseenter',()=>paint(i+1));btn.addEventListener('focus',()=>paint(i+1));btn.addEventListener('click',()=>{const n=Number(btn.dataset.rating);window.location.href='feedback.html?rating='+n;});});document.querySelector('.stars').addEventListener('mouseleave',()=>paint(0));function paint(n){buttons.forEach((b,i)=>b.classList.toggle('active',i<n));}</script></body></html>
